name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, 1.85.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup override set ${{ matrix.toolchain }}
      - run: cargo fmt --all -- --check
      - run: cargo test --no-default-features
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rustdoc and doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --doc --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - run: rustup override set stable
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --all-features --workspace --fail-under-lines 95

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - run: cargo publish --dry-run

