name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Published crate version to verify or release
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - name: Publish crate if needed
        shell: bash
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          if curl --fail --silent --show-error \
            --user-agent "range-cache-release/${version}" \
            "https://crates.io/api/v1/crates/range-cache/${version}" \
            >/dev/null; then
            echo "range-cache ${version} is already published"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
